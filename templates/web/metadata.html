<!doctype html>
<html lang="en">
<head>
  <!-- charset must come first (within the first 1024 bytes). -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google tag (gtag.js). Not really metadata, but important: ask the web
       team for a measurement ID and how to configure it.
       - Requires CSP changes: allow Google's script and connect domains and
         use a nonce for the inline block (see headers.example).
       - Analytics means the app needs a privacy policy and may need cookie
         consent. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Unique per page. Keep under ~60 characters. -->
  <title>Page title | Example Application | RMI</title>
  <!-- Unique per page. Aim for 120–160 characters. -->
  <meta name="description" content="Concise, human-readable summary of this page's content.">

  <!-- Absolute URL; must match the URL in sitemap.xml (incl. trailing slash). -->
  <link rel="canonical" href="https://example.rmi.org/page">

  <!-- index,follow is the default; only needed to opt out, e.g. noindex on
       non-production, search results, or thin pages. -->
  <!-- <meta name="robots" content="noindex"> -->

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RMI">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Page title">
  <meta property="og:description" content="Concise description of this page.">
  <meta property="og:url" content="https://example.rmi.org/page">
  <!-- 1200×630 PNG or JPG, absolute URL. -->
  <meta property="og:image" content="https://example.rmi.org/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Description of the social card image.">

  <!-- Twitter/X falls back to og:* for title, description, and image. -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"><!-- 180×180 -->
  <link rel="manifest" href="/site.webmanifest">
  <!-- Should match theme_color in site.webmanifest. -->
  <meta name="theme-color" content="#ffffff">

  <!-- Structured data: see structured-data.jsonld. Only describe content that
       is visible on the page. -->
  <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "WebSite", "...": "..." }
  </script>
</head>
<body>
  <main>
    <h1>Page title</h1>
  </main>
</body>
</html>
